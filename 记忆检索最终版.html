const KNOWN_ROMAJI = [
  'dzu', 'shi', 'tsu', 'chi',
  'ka', 'ki', 'ku', 'ke', 'ko',
  'sa', 'si', 'su', 'se', 'so',
  'ta', 'ti', 'tu', 'te', 'to',
  'na', 'ni', 'nu', 'ne', 'no',

  'pa', 'pi', 'pu', 'pe', 'po',
  'nn', 'a', 'i', 'u', 'e', 'o', 'n'
];

function tokenizeContinuousRomaji(str) {
  let s = str.trim().toLowerCase();
  const tokens = [];
  while (s.length > 0) {
    let matched = false;
    for (const r of KNOWN_ROMAJI) {
      if (s.startsWith(r)) {
        tokens.push(r);
        s = s.slice(r.length);
        matched = true;
        break;
      }
    }
    if (!matched) {
      tokens.push(s.slice(0, 1));
      s = s.slice(1);
    }
  }
  return tokens;
}

function parseTokens(rawQuery) {
  if (!rawQuery) return { tokens: [], isPureKanaQuery: false };
  const normalized = rawQuery.replace(/[\u3000\s]+/g, ' ').trim().toLowerCase();
  if (!normalized) return { tokens: [], isPureKanaQuery: false };

  const cleanedKanaOnly = normalized.replace(/[\s,，、/+\|；;]+/g, '');
  const isPureKanaQuery = /^[\u3040-\u309F\u30A0-\u30FF]+$/.test(cleanedKanaOnly);

  const rawSegments = normalized.split(/[\s,，、/+\|；;]+/g).filter(Boolean);
  const finalTokens = [];

  for (const seg of rawSegments) {
    const isPureKana = /^[\u3040-\u309F\u30A0-\u30FF]+$/.test(seg);
    if (isPureKana) {
      for (const char of seg) {
        finalTokens.push(char);
      }
      continue;
    }

    const isPureAlpha = /^[a-z]+$/.test(seg);
    if (isPureAlpha) {
      const isSingleSyllable = KNOWN_ROMAJI.some(r => r === seg && r.length === seg.length);
      if (seg.length > 1 && !isSingleSyllable) {
        const sub = tokenizeContinuousRomaji(seg);
        if (sub.length > 1) {
          finalTokens.push(...sub);
          continue;
        }
      }
    }
    finalTokens.push(seg);
  }

  const validTokens = finalTokens.filter(t => t && t.length > 0);
  return { tokens: validTokens, isPureKanaQuery };
}

function playSpeech(text) {
  if (!text || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'ja-JP';
  utterance.rate = 0.9;
  window.speechSynthesis.speak(utterance);
}

function highlight(text, tokens) {
  if (!text || !tokens || tokens.length === 0) return text || '';
  const lower = text.toLowerCase();
  const matched = tokens.find(t => lower.includes(t));
  if (!matched) return text;
  const idx = lower.indexOf(matched);
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + matched.length) + '</mark>' + text.slice(idx + matched.length);
}

function renderTable() {
  const inputEl = document.getElementById('searchInput');
  const query = inputEl ? inputEl.value : '';
  const clearBtn = document.getElementById('clearBtn');
  if (clearBtn) clearBtn.style.display = query ? 'flex' : 'none';

  const { tokens, isPureKanaQuery } = parseTokens(query);

  let filtered = KANA_DATA;
  if (tokens.length > 0) {
    const result = [];
    for (const token of tokens) {
      const t = token.toLowerCase();
      const directMatch = KANA_DATA.find(item => 
        item.kana === t || 
        item.katakana === t || 
        item.romaji.toLowerCase() === t || 
        item.romajiList.some(r => r.toLowerCase() === t)
      );

      if (directMatch) {
        result.push(directMatch);
        continue;
      }

      if (!isPureKanaQuery) {
        const wordMatches = KANA_DATA.filter(item => {
          const matchesEx = item.examples.some(ex => {
            if (!ex.wordJp && !ex.wordCn) return false;
            return ex.wordJp.toLowerCase().includes(t) || ex.wordCn.toLowerCase().includes(t);
          });
          if (matchesEx) return true;
          if (item.examples.some(ex => String(ex.code) === t)) return true;
          return false;
        });

        for (const wm of wordMatches) {
          if (!result.includes(wm)) {
            result.push(wm);
          }
        }
      }
    }
    filtered = result;
  }

  // Update Count & Badges
  const countEl = document.getElementById('matchCount');
  if (countEl) countEl.textContent = filtered.length;

  const infoTags = document.getElementById('infoTags');
  if (infoTags) {
    infoTags.innerHTML = `<span>显示结果: <strong style="color:#0f172a;">${filtered.length}</strong> / 64 个音图</span>`;
    if (tokens.length > 0) {
      infoTags.innerHTML += ` · <span>匹配词: ` + tokens.map(t => `<span class="matched-chip">${t}</span>`).join(' ') + `</span>`;
    }
  }

  const tbody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  const table = document.getElementById('kanaTable');

  if (filtered.length === 0) {
    if (tbody) tbody.innerHTML = '';
    if (emptyState) emptyState.style.display = 'block';
    if (table) table.style.display = 'none';
    return;
  }

  if (emptyState) emptyState.style.display = 'none';
  if (table) table.style.display = 'table';

  if (tbody) {
    tbody.innerHTML = filtered.map(row => {
      const e1 = row.examples[0] || {};
      const e2 = row.examples[1] || {};
      const e3 = row.examples[2] || {};

      const renderEx = (ex, isAltBg) => {
        const bg = isAltBg ? 'background:#fafafa;' : '';
        const jp = ex.wordJp ? `
          <td style="${bg}font-weight:600;color:#1e293b;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span>${highlight(ex.wordJp, tokens)}</span>
              <button type="button" class="sound-btn" onclick="playSpeech('${ex.wordJp}')" title="朗读">🔊</button>
            </div>
          </td>` : `<td style="${bg}"><div class="empty-block"></div></td>`;

        const cn = ex.wordCn ? `<td style="${bg}color:#475569;">${highlight(ex.wordCn, tokens)}</td>` : `<td style="${bg}"><div class="empty-block"></div></td>`;

        const code = ex.code ? `<td style="${bg}text-align:center;"><span class="code-badge code-${ex.code}">${ex.code}</span></td>` : `<td style="${bg}text-align:center;">-</td>`;

        return jp + cn + code;
      };

      return `
        <tr>
          <td class="kana-cell">
            <div class="kana-main">
              <span>${highlight(row.kana, tokens)}</span>
              <button type="button" class="sound-btn" onclick="playSpeech('${row.kana}')" title="朗读发音">🔊</button>
            </div>
            <div class="kana-romaji">${highlight(row.romaji, tokens)}</div>
          </td>
          ${renderEx(e1, false)}
          ${renderEx(e2, true)}
          ${renderEx(e3, false)}
        </tr>
      `;
    }).join('');
  }
}

function setQuery(q) {
  const input = document.getElementById('searchInput');
  if (input) {
    input.value = q;
    renderTable();
    input.focus();
  }
}

const inputEl = document.getElementById('searchInput');
if (inputEl) {
  inputEl.addEventListener('input', renderTable);
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      renderTable();
    }
  });
}

const clearBtnEl = document.getElementById('clearBtn');
if (clearBtnEl) {
  clearBtnEl.addEventListener('click', () => {
    setQuery('');
  });
}

// Initial Render
renderTable();
